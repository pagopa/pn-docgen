[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pn-docgen"
version = "0.1.0"
description = "AWS Architecture Diagram Generator for SEND (pn-docgen)"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "boto3>=1.34",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fonttools==4.60.1",
]

[project.optional-dependencies]
raster = ["resvg-py==0.5.0"]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pn-docgen = "pndocgen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pndocgen*"]

[tool.setuptools.package-data]
pndocgen = ["py.typed", "engine/d2/templates/*.d2_template", "engine/d2/icons/aws/*.png", "engine/d2/icons/aws/NOTICE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["private: requires private historical captures; opt in with --private-root",
           "legacy_golden: exact historical geometry, diagnostic opt-in with --legacy-goldens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
